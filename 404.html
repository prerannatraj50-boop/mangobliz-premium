<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MangoBliz</title>
    <script>
      // GitHub Pages SPA fallback: rewrite deep links to the SPA root while
      // preserving the requested path so the client router can pick it up.
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('spa-redirect', path);
        window.location.replace('./');
      })();
    </script>
  </head>
  <body></body>
</html>
